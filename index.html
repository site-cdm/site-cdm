

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion / Inscription</title>
</head>
<body>

    <h2>Connexion / Inscription</h2>
    
    <p id="message-erreur" style="color: red; display: none;"></p>

    <form onsubmit="gererConnexion(event)">
        <label>Identifiant :</label><br>
        <input type="text" id="username" required><br><br>

        <label>Mot de passe :</label><br>
        <input type="password" id="password" required><br><br>

        <button type="submit">Se connecter / Créer son compte</button>
    </form>

    <script>
        // Redirige vers votre page cdm.html après connexion
        var pageCible = "cdm.html";

        function gererConnexion(event) {
            event.preventDefault();

            var user = document.getElementById('username').value.trim();
            var pass = document.getElementById('password').value;
            var msgErreur = document.getElementById('message-erreur');
            msgErreur.style.display = 'none';

            var utilisateurs = JSON.parse(localStorage.getItem('utilisateurs')) || { "admin": "1234" };

            // Inscription automatique si le compte n'existe pas
            if (!utilisateurs[user]) {
                utilisateurs[user] = pass;
                localStorage.setItem('utilisateurs', JSON.stringify(utilisateurs));
                localStorage.setItem('currentUser', user);
                ajouterHistorique(user);
                window.location.href = pageCible;
            } 
            // Connexion si le mot de passe est correct
            else if (utilisateurs[user] === pass) {
                localStorage.setItem('currentUser', user);
                ajouterHistorique(user);
                window.location.href = pageCible;
            } 
            // Erreur de mot de passe
            else {
                msgErreur.textContent = "Mot de passe incorrect pour cet identifiant.";
                msgErreur.style.display = 'block';
            }
        }

        function ajouterHistorique(utilisateurConnecte) {
            var historique = JSON.parse(localStorage.getItem('journalConnexions')) || [];
            historique.push({
                utilisateur: utilisateurConnecte,
                date: new Date().toLocaleString('fr-FR')
            });
            localStorage.setItem('journalConnexions', JSON.stringify(historique));
        }
    </script>

</body>
</html>
