<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
</head>
<body>

    <h2>Connexion requise</h2>
    
    <p id="message-erreur" style="color: red; display: none;">Identifiant ou mot de passe incorrect.</p>

    <form onsubmit="verifierConnexion(event)">
        <label>Identifiant :</label><br>
        <input type="text" id="username" required><br><br>

        <label>Mot de passe :</label><br>
        <input type="password" id="password" required><br><br>

        <button type="submit">Se connecter</button>
    </form>

  <script>
    var pageCible = "cdm.html"; // Nom de votre page d'accueil

    function verifierConnexion(event) {
        event.preventDefault();

        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;

        if (user === "admin" && pass === "1234") {
            
            // --- ENREGISTREMENT DE LA CONNEXION ---
            var historique = JSON.parse(localStorage.getItem('journalConnexions')) || [];
            var nouvelleConnexion = {
                utilisateur: user,
                date: new Date().toLocaleString('fr-FR')
            };
            historique.push(nouvelleConnexion);
            localStorage.setItem('journalConnexions', JSON.stringify(historique));
            // --------------------------------------

            window.location.href = pageCible;
        } else {
            document.getElementById('message-erreur').style.display = 'block';
        }
    }
</script>

</body>
</html>
